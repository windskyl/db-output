[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-output"
version = "0.1.0"
description = "Rule-driven targeted data collection skeleton"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "windskyl" }
]
dependencies = []

[project.scripts]
db-output = "app.interfaces.cli.main:main"
db-output-web = "app.interfaces.web.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
